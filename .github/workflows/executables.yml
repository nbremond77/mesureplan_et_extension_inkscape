# Construction automatique des exécutables Windows, macOS (Intel et Apple Silicon) et Linux.
# Déclenchement : manuel (onglet Actions) ou à la création d'une étiquette v* (ex. v1.3.0),
# auquel cas les archives sont jointes à une « release » GitHub.
name: Exécutables

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Étiquette de la release à créer (ex. v1.3.0) — vide : pas de publication"
        required: false
  push:
    tags: ["v*"]

jobs:
  construction:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: windows-x64
          #- os: macos-14          # Apple Silicon (arm64)
          #  nom: macos-arm64
          #- os: macos-13          # Intel (x86_64)
          #  nom: macos-x86_64
          - os: ubuntu-22.04      # glibc 2.35 : fonctionne sur les distributions récentes (Manjaro, Ubuntu 22.04+…)
            nom: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build,dev]"

      - name: Tests du noyau
        run: python -m pytest -q

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/mesureplan.spec

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MesurePlan -DestinationPath MesurePlan-${{ matrix.nom }}.zip

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/MesurePlan.app MesurePlan-${{ matrix.nom }}.zip

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf MesurePlan-${{ matrix.nom }}.tar.gz -C dist MesurePlan

      - uses: actions/upload-artifact@v4
        with:
          name: MesurePlan-${{ matrix.nom }}
          path: MesurePlan-${{ matrix.nom }}.*

  publication:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: construction
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: archives/*
